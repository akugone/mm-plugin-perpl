<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1531"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f74ff"/>
      <stop offset="1" stop-color="#5a3ce0"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- guard: shield -->
  <path d="M512 150 L790 250 V500 C790 680 670 800 512 870 C354 800 234 680 234 500 V250 Z" fill="url(#shield)"/>
  <path d="M512 150 L790 250 V500 C790 680 670 800 512 870 C354 800 234 680 234 500 V250 Z" fill="none" stroke="#c9bcff" stroke-opacity=".35" stroke-width="10"/>
  <!-- perps: candles + rising trend -->
  <g stroke-linecap="round">
    <line x1="370" y1="470" x2="370" y2="640" stroke="#ffffff" stroke-opacity=".55" stroke-width="10"/>
    <rect x="345" y="510" width="50" height="95" rx="10" fill="#ffffff" fill-opacity=".9"/>
    <line x1="470" y1="400" x2="470" y2="600" stroke="#ffffff" stroke-opacity=".55" stroke-width="10"/>
    <rect x="445" y="440" width="50" height="120" rx="10" fill="#ffffff" fill-opacity=".9"/>
    <line x1="570" y1="330" x2="570" y2="540" stroke="#ffffff" stroke-opacity=".55" stroke-width="10"/>
    <rect x="545" y="365" width="50" height="135" rx="10" fill="#ffffff" fill-opacity=".9"/>
  </g>
  <!-- agent wallet: orange arrow -->
  <path d="M330 690 L470 560 L560 620 L700 450" fill="none" stroke="url(#fox)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 440 L712 436 L708 508" fill="none" stroke="url(#fox)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
